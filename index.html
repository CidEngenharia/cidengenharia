<!DOCTYPE html>
<html lang="pt-BR" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>CidEngenharia | Sidney Sales - Engenharia 360° & IA</title>
    <meta name="description" content="Studio premium especializado em Engenharia Visual e IA Generativa.">

    <link rel="icon" type="image/png" href="/favicon.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <!-- Biblioteca QR Code JS solicitada -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script async src="https://js.stripe.com/v3/buy-button.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script>
        window.process = window.process || { env: {} };
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95',
                        },
                        secondary: '#8b5cf6',
                    },
                    fontFamily: {
                        display: ["'Roboto'", "sans-serif"],
                        body: ["'Roboto'", "sans-serif"],
                        roboto: ["'Roboto'", "sans-serif"],
                    },
                }
            }
        }
    </script>
    <style>
        html {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .engineering-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(139, 92, 246, 0.3);
            border-radius: 20px;
        }

        .galaxy-band {
            position: absolute;
            left: 8%;
            top: -18%;
            width: 58%;
            height: 135%;
            transform: rotate(23deg);
            background:
                radial-gradient(ellipse at 48% 50%, rgba(244, 226, 197, 0.28) 0%, rgba(167, 139, 250, 0.16) 18%, rgba(96, 165, 250, 0.08) 36%, transparent 68%),
                radial-gradient(ellipse at 52% 50%, rgba(255, 255, 255, 0.18) 0%, transparent 38%);
            filter: blur(18px);
            opacity: 0.58;
            mix-blend-mode: screen;
            animation: galaxy-breathe 12s ease-in-out infinite;
        }

        .galaxy-star {
            position: absolute;
            border-radius: 999px;
            background: rgba(236, 244, 255, 0.95);
            box-shadow: 0 0 5px rgba(226, 232, 255, 0.55);
            animation-name: galaxy-star-drift;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes galaxy-breathe {
            0%, 100% {
                transform: rotate(23deg) scale(1);
                opacity: 0.46;
            }

            50% {
                transform: rotate(23deg) scale(1.04);
                opacity: 0.68;
            }
        }

        @keyframes galaxy-star-drift {
            0%, 100% {
                transform: translate3d(0, 0, 0) scale(0.82);
                filter: brightness(0.85);
            }

            50% {
                transform: translate3d(7px, -5px, 0) scale(1.08);
                filter: brightness(1.3);
            }
        }

        .service-constellation {
            min-height: 18px;
        }

        .service-star {
            width: 16px;
            height: 16px;
            display: grid;
            place-items: center;
            color: #ddd6fe;
            font-size: 14px;
            font-weight: 300;
            line-height: 1;
            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.9),
                0 0 18px rgba(167, 139, 250, 0.85);
            animation: service-star-pulse 3.45s ease-in-out infinite;
        }

        @keyframes service-star-pulse {
            0%, 26%, 100% {
                transform: scale(0.72) rotate(0deg);
                opacity: 0.62;
            }

            34%, 52% {
                transform: scale(1.05) rotate(18deg);
                opacity: 1;
            }
        }

        @media (max-width: 767px) {
            .service-star {
                animation-duration: 2.6s;
            }

            .galaxy-band {
                left: -18%;
                width: 86%;
                opacity: 0.42;
            }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.24.8",
    "three": "https://esm.sh/three@0.170.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>

<body class="bg-[#f8fafc] dark:bg-[#020617] text-slate-800 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
